# Starter Sigma rules for inspecthor.
#
# A handful of high-signal detections that exercise the evaluator and produce
# something useful on a fresh install. Point --sigma-rules at SigmaHQ for real
# coverage; these are a floor, not a suite.
#
# Every rule here stays inside the documented supported subset (no aggregations).
---
title: Audit Log Cleared
id: 9f1c2b64-0001-4a0e-9f2a-1a2b3c4d5e01
status: stable
description: |
    The security or system event log was cleared, a common anti-forensics step.

    Both event ids MUST be qualified by provider. 104 and 1102 are not reserved:
    on one real workstation this rule fired 205 times, every hit a Win32PnpWatcher
    PnP notification, because 215 distinct providers use 104 for their own purposes.
    That is the same mistake the EVTX family fallback made -- see DESIGN.md -- and
    an unqualified id here reintroduces it from the rule side.
logsource:
    product: windows
detection:
    security_log:
        Provider_Name: 'Microsoft-Windows-Eventlog'
        EventID: '1102'
    system_log:
        Provider_Name: 'Microsoft-Windows-Eventlog'
        EventID: '104'
    condition: security_log or system_log
level: high
tags:
    - attack.t1070.001
    - attack.defense_evasion
---
title: Encoded PowerShell Command
id: 9f1c2b64-0002-4a0e-9f2a-1a2b3c4d5e02
status: stable
description: PowerShell launched with a base64-encoded command, typical of droppers.
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        CommandLine|contains:
            - '-enc '
            - '-EncodedCommand'
            - '-e JAB'
    condition: selection
level: high
tags:
    - attack.t1059.001
    - attack.execution
---
title: Service Installed From Suspicious Path
id: 9f1c2b64-0003-4a0e-9f2a-1a2b3c4d5e03
status: experimental
description: A new service points at a temp, public, or user-writable location.
logsource:
    product: windows
detection:
    selection:
        EventID:
            - '7045'
            - '4697'
    paths:
        ImagePath|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\'
            - 'powershell'
            - 'cmd.exe /c'
    condition: selection and paths
level: high
tags:
    - attack.t1543.003
    - attack.persistence
---
title: Credential Dumping Indicators
id: 9f1c2b64-0004-4a0e-9f2a-1a2b3c4d5e04
status: experimental
description: Command line referencing LSASS dumping or registry hive extraction.
logsource:
    product: windows
    category: process_creation
detection:
    mimikatz:
        CommandLine|contains:
            - 'sekurlsa'
            - 'lsadump'
            - 'privilege::debug'
    hive_save:
        CommandLine|contains:
            - 'reg save hklm\sam'
            - 'reg save hklm\system'
            - 'reg save hklm\security'
    condition: 1 of them
level: critical
tags:
    - attack.t1003.001
    - attack.t1003.002
    - attack.credential_access
---
title: SSH Brute Force Succeeded
id: 9f1c2b64-0005-4a0e-9f2a-1a2b3c4d5e05
status: experimental
description: A password login succeeded from an address that had just been failing repeatedly.
logsource:
    product: linux
detection:
    selection:
        event_type: 'ssh_login_success'
    correlated:
        message|contains: 'Brute-force SUCCESS'
    condition: selection and correlated
level: high
tags:
    - attack.t1110.001
    - attack.credential_access
---
title: Defender Exclusion or Disable
id: 9f1c2b64-0006-4a0e-9f2a-1a2b3c4d5e06
status: experimental
description: Windows Defender was disabled or an exclusion path was added.
logsource:
    product: windows
detection:
    disabled:
        EventID: '5001'
    exclusion:
        event_type: 'defender_exclusion'
    tamper:
        CommandLine|contains:
            - 'Add-MpPreference'
            - 'Set-MpPreference -DisableRealtimeMonitoring'
    condition: 1 of them
level: high
tags:
    - attack.t1562.001
    - attack.defense_evasion
